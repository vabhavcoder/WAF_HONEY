<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Active Deception Proxy — Dashboard{% endblock %}</title>
  {% block refresh %}{% endblock %}
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --border: #2a2f3a;
      --text: #e6e8eb;
      --muted: #9aa4b2;
      --accent: #4da3ff;
      --high: #e05a5a;
      --medium: #e0a05a;
      --low: #7a8291;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: baseline;
      gap: 24px;
    }
    header h1 {
      font-size: 16px;
      margin: 0;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      margin-right: 18px;
    }
    nav a:hover, nav a.active {
      color: var(--accent);
    }
    main {
      padding: 24px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px 20px;
      margin-bottom: 20px;
    }
    .panel h2 {
      margin-top: 0;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }
    .stat-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .stat {
      flex: 1;
      min-width: 140px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px 16px;
    }
    .stat .value {
      font-size: 28px;
      font-weight: 700;
    }
    .stat .label {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      text-align: left;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    th {
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.04em;
    }
    tr:hover td { background: rgba(255,255,255,0.02); }
    a.ip-link { color: var(--accent); text-decoration: none; font-family: monospace; }
    a.ip-link:hover { text-decoration: underline; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .severity-high { background: rgba(224,90,90,0.15); color: var(--high); }
    .severity-medium { background: rgba(224,160,90,0.15); color: var(--medium); }
    .severity-low { background: rgba(122,130,145,0.15); color: var(--low); }
    .badge-honeypot { background: rgba(224,90,90,0.15); color: var(--high); }
    .badge-backend { background: rgba(122,130,145,0.15); color: var(--low); }
    .empty { color: var(--muted); font-style: italic; padding: 12px 0; }
    .footer-note { color: var(--muted); font-size: 12px; margin-top: 24px; }
    code { background: var(--bg); padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <header>
    <h1>Active Deception Proxy</h1>
    <nav>
      <a href="/" class="{{ 'active' if active_page == 'summary' else '' }}">Summary</a>
      <a href="/timeline" class="{{ 'active' if active_page == 'timeline' else '' }}">Flagged Timeline</a>
      <a href="/honeypot" class="{{ 'active' if active_page == 'honeypot' else '' }}">Honeypot Log</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
